<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Viewport + PWA + theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A2540" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="محتار" />
    <meta name="application-name" content="محتار" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- SEO -->
    <meta name="description" content="محتار — أول مستشار ذكي سعودي للقبول الجامعي. من 7 أسئلة إلى 3 مسارات وظيفية معتمدة على بيانات وزارة التعليم و 29 جامعة حكومية." />
    <meta name="keywords" content="محتار, استشارة جامعية, قبول جامعي, السعودية, تخصصات جامعية, مسار وظيفي, رؤية 2030" />
    <meta name="author" content="Abdulrahman Alkhunayn" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="محتار | مرشدك الجامعي الذكي" />
    <meta property="og:description" content="محتار؟ عندك مرشد ومستشار. يحدد مسارك الجامعي ويوصلك للتخصص المختار خلال 3 دقائق." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="محتار | مرشدك الجامعي الذكي" />
    <meta name="twitter:description" content="Career-first AI counselor for Saudi university admission. 29 universities, 18+ majors, RIASEC brain." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>محتار · مرشدك الجامعي الذكي</title>

    <!-- iOS splash screen (optional but premium) -->
    <style>
      html, body { margin: 0; padding: 0; background: #0A2540; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-family: Tajawal, sans-serif; }
      #boot.fade { animation: fadeout .4s ease .25s forwards; }
      @keyframes fadeout { to { opacity: 0; visibility: hidden; } }
    </style>
  </head>
  <body>
    <div id="boot">جاري التحميل…</div>
    <div id="root"></div>

    <!-- Register service worker (PWA offline shell) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
      // Remove boot loader after React mounts
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const b = document.getElementById('boot');
          if (b) { b.classList.add('fade'); setTimeout(() => b.remove(), 800); }
        }, 50);
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
